const firebaseConfig={apiKey:"AIzaSyDnQsK7jNVciU2Ruo-mwELvFR97S6tNhgg",authDomain:"teg-tv.firebaseapp.com",projectId:"teg-tv",storageBucket:"teg-tv.firebasestorage.app",messagingSenderId:"735650643113",appId:"1:735650643113:web:e0ad00556934ce48773db8"};

window.onerror=function(m,src,l){var e=$('errbar');e.style.display='block';e.textContent='⚠️ '+m+(l?' (línea '+l+')':'')};

// --- DECLARACIÓN INICIAL DE AUDIO ---
let gameMuted = false;
let AC=null,PV=null;

window.toggleGameMute = function() {
    gameMuted = !gameMuted;
    const btn = document.getElementById('muteGameBtn');

function audio(){
  if(gameMuted) return;
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}

function osc(t,f,f2,d,v,type){
  if(!AC || gameMuted) return;
  const o=AC.createOscillator(),g=AC.createGain(),T0=AC.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,T0);o.frequency.exponentialRampToValueAtTime(f2,T0+d*.8);
  g.gain.setValueAtTime(v,T0);g.gain.exponentialRampToValueAtTime(.001,T0+d);o.connect(g);g.connect(AC.destination);o.start(T0);o.stop(T0+d+.02)
}

const sndDrop=()=>{ if(gameMuted) return; osc(0,260,110,.14,.5,'triangle');osc(0,1500,700,.04,.12,'square')};
const sndMeld=()=>{ if(gameMuted) return; [300,360,430].forEach((f,k)=>{osc(k*.08,f,f*.5,.12,.4,'triangle');osc(k*.08,1500,800,.03,.08,'square')});osc(.26,660,660,.35,.18,'sine');osc(.36,880,880,.45,.18,'sine')};

document.addEventListener('click',audio);
document.addEventListener('keydown',audio); // Recuperamos el keydown para asegurar inicialización de audio

// --- VARIABLES GLOBALES RESTANTES ---
const COL=['#d32f2f','#f9a825','#1976d2','#222'];
const N=i=>i>=104?0:(i%52)%13+1, C=i=>i>=104?4:Math.floor((i%52)/13);
const V=i=>{const n=N(i);return n===0?50:n===1?15:n===2?20:n<=7?5:10};
const T=(i,x='',st='')=>`<div class="t ${x}" data-i="${i}" style="color:${i>=104?'#7b1fa2':COL[C(i)]};${st}">${i>=104?'★':N(i)}</div>`;
const sortR=a=>[...a].sort((x,y)=>(C(x)-C(y))||(N(x)-N(y)));
let me,ref,S=null,sel=new Set();
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)};

// --- SISTEMA DE NAVEGACIÓN D-PAD CON REPARACIÓN PARA BOTÓN OK (ENTER) ---
let currentFocusIndex = -1;
function handleDPadNavigation(e) {
  // SOLUCIÓN PARA SMART TV: Si se pulsa OK/Enter, forzar click en el elemento resaltado
  if (e.key === 'Enter' || e.keyCode === 13) {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
        e.preventDefault();
        document.activeElement.click();
    }
    return;
  }

  const focusables = Array.from(document.querySelectorAll('button:not([disabled]):not(.hidden), input:not(.hidden)'))
                          .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0);
  if(focusables.length === 0) return;

  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    currentFocusIndex = (currentFocusIndex + 1) % focusables.length;
    focusables[currentFocusIndex].focus();
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    currentFocusIndex = (currentFocusIndex - 1 + focusables.length) % focusables.length;
    focusables[currentFocusIndex].focus();
  }
}
document.addEventListener('keydown', handleDPadNavigation);


// ---- validación de juegos ----
function meldInfo(ids){
 if(ids.length<3||ids.length>14)return null;
 const gs=[...new Set(ids.filter(N).map(N))];
 for(const g of gs){
  const nat=ids.filter(i=>N(i)===g),oth=ids.filter(i=>N(i)!==g);
  if(oth.length>1||oth.some(i=>N(i)&&N(i)!==2))continue;
  if(nat.length<2)continue;
  return{t:'p',ids:[...nat,...oth],w:oth.length};
 }
 const cols=[...new Set(ids.filter(i=>N(i)&&N(i)!==2).map(C))];
 if(cols.length>1)return null;
 const tc=cols.length?cols:[...new Set(ids.filter(i=>N(i)===2).map(C))],L=ids.length;
 let best=null;
 for(const col of tc)for(let s=1;s+L-1<=14;s++){
  const pos=Array(L).fill(null),left=[];
  for(const i of ids){const n=N(i);let p=-1;if(n&&C(i)===col)p=n===1?(s===1?0:14-s):n-s;
   if(p>=0&&p<L&&pos[p]===null)pos[p]=i;else left.push(i)}
  if(left.some(i=>N(i)&&N(i)!==2)||left.length>1)continue;
  if(left.length)pos[pos.indexOf(null)]=left[0];
  if(!best||left.length<best.w)best={t:'e',ids:pos,w:left.length};
 }
 return best;
}

// ---- lógica ----
const act=(fn,opt=true)=>{if(opt&&S){try{const l=JSON.parse(JSON.stringify(S));fn(l);render(l)}catch(e){toast(e.message||'Error');return}}return runTransaction(db,async t=>{const sn=await t.get(ref);const s=sn.data();fn(s);t.set(ref,s)}).catch(e=>toast(e.message||'Error'))};
const idx=s=>s.players.findIndex(p=>p.uid===me);
const hasCan=(s,tm)=>s.melds.some(m=>m.team===tm&&m.ids.length>=7);
function turnChk(s,u){const i=s.players.findIndex(p=>p.uid===u);if(i<0||s.turn!==i)throw Error('No es tu turno');return i}
function nextT(s){s.turn=(s.turn+1)%s.players.length;s.drawn=false}
function after(s,i,disc,cutId){
 const u=s.players[i].uid,tm=i%2,h=s.hands[u];
 if(h.length===0){
  if(s.mtn[tm]<s.mtT){s.hands[u]=s.muertos[tm+'_'+s.mtn[tm]];s.mtn[tm]++;s.msg+=' ¡Levantó el muerto'+(s.mtT>1?' ('+s.mtn[tm]+' de '+s.mtT+')':'')+'!';if(disc)nextT(s);return}
  if(!hasCan(s,tm))throw Error('Para cerrar necesitás una canasta: guardate una ficha');
  s.cutId=cutId===undefined?null:cutId;
  return endHand(s,tm);
 }
 if(disc)nextT(s);
}
function endHand(s,closer){
 s.closer=closer;if(closer===null)s.cutId=null;
 const res=[0,1].map(tm=>{
  const mine=s.melds.filter(m=>m.team===tm);
  const mp=mine.reduce((a,m)=>a+m.ids.reduce((b,i)=>b+V(i),0),0),cb=mine.reduce((a,m)=>a+(m.ids.length>=7?(m.w?100:200):0),0);
  const noCan=closer!==null&&closer!==tm&&!hasCan(s,tm);
  let p=noCan?-mp:mp+cb;
  p+=s.mtn[tm]*100-(s.mtT-s.mtn[tm])*100;if(closer===tm)p+=100;
  s.players.forEach((pl,k)=>{if(k%2===tm)p-=(s.hands[pl.uid]||[]).reduce((a,i)=>a+V(i),0)});
  s.scores[tm]+=p;return{team:tm,pts:p,total:s.scores[tm],noCan};
 });
s.winner=res[0].pts===res[1].pts?-1:(res[0].pts>res[1].pts?0:1);
 s.result=res;s.phase=res.some(r=>r.total>=3000)?'over':'end';
}
function deal(s){
 const a=[...Array(106).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 s.hands={};s.players.forEach(p=>s.hands[p.uid]=a.splice(0,11));
 s.mtT=s.players.length===2?2:1;s.muertos={};[0,1].forEach(t=>{for(let k=0;k<s.mtT;k++)s.muertos[t+'_'+k]=a.splice(0,11)});s.mtn=[0,0];
 s.cutId=null;s.closer=null;s.winner=-1;s.pozo=a.splice(0,1);s.deck=a;s.melds=[];s.phase='play';s.drawn=false;s.result=null;
 s.turn=((s.hand=(s.hand||0)+1)-1)%s.players.length;s.msg='¡Nueva mano!';
}
// acciones de juego
const M={
 draw(s,u){const i=turnChk(s,u);if(s.drawn)throw Error('Ya robaste');
  if(!s.deck.length)return endHand(s,null);
  s.hands[u].push(s.deck.pop());s.drawn=true;s.msg=s.players[i].name+' robó del mazo'},
 pozo(s,u){const i=turnChk(s,u);if(s.drawn)throw Error('Ya robaste');if(!s.pozo.length)throw Error('El pozo está vacío');
  s.hands[u].push(...s.pozo);s.msg=s.players[i].name+' levantó el pozo ('+s.pozo.length+')';s.pozo=[];s.drawn=true},
 meld(s,u,ids){const i=turnChk(s,u);if(!s.drawn)throw Error('Primero robá');
  const inf=meldInfo(ids);if(!inf)throw Error('Esa combinación no es válida');
  s.hands[u]=s.hands[u].filter(x=>!ids.includes(x));s.melds.push({id:Date.now()+s.melds.length,team:i%2,...inf});
  s.msg=s.players[i].name+' bajó un juego';after(s,i,false)},
 add(s,u,mid,ids){const i=turnChk(s,u);if(!s.drawn)throw Error('Primero robá');
  const m=s.melds.find(x=>x.id===mid);if(!m||m.team!==i%2)throw Error('Juego inválido');
  const inf=meldInfo([...m.ids,...ids]);if(!inf)throw Error(m.w?'Ese juego ya tiene un comodín: la ficha solo entra si va en su número y color':'No encaja en ese juego');
  s.hands[u]=s.hands[u].filter(x=>!ids.includes(x));Object.assign(m,inf);

function bestMeld(h,noP){
 const wild=h.filter(t=>N(t)===0||N(t)===2).sort((a,b)=>N(b)-N(a));
 let best=null,bs=0;
 const consider=(ids,pen)=>{if(ids.length<3)return;const inf=meldInfo(ids);if(!inf)return;const sc=ids.length-pen;if(sc>bs){bs=sc;best=inf.ids}};
 if(!noP)for(let g=1;g<=13;g++){const t=h.filter(x=>N(x)===g);
  if(t.length>=3)consider(t,1.2);
  else if(t.length===2){const w=wild.find(x=>N(x)!==g);if(w!==undefined)consider([...t,w],2.7)}}
 for(let c=0;c<4;c++)for(let st=1;st<=12;st++)for(let L=3;st+L-1<=14;L++){
  const ids=[];let miss=0;
  for(let p=0;p<L;p++){const n=st+p>13?1:st+p;const t=h.find(x=>C(x)===c&&N(x)===n&&!ids.includes(x));if(t!==undefined)ids.push(t);else miss++}
  if(miss===0)consider(ids,0);
  else if(miss===1){const w=wild.find(x=>!ids.includes(x));if(w!==undefined)consider([...ids,w],1.5)}}
 return best;
}
function keepScore(t,h){
 if(N(t)===0)return 1000;if(N(t)===2)return 500;
 let sc=0;
 for(const o of h){if(o===t||N(o)===0)continue;const a=N(t),b=N(o);
  if(a===b)sc+=3;
  if(C(o)===C(t)){let d=Math.abs(a-b);if(a===1||b===1)d=Math.min(d,Math.abs((a===1?14:a)-(b===1?14:b)));if(d===1)sc+=3;else if(d===2)sc+=1}}
 return sc-V(t)/10;
}
function botDiscard(s,u){

 const opp=s.melds.filter(m=>m.team!==tm);
 const helps=t=>opp.some(m=>{const inf=meldInfo([...m.ids,t]);return inf&&inf.w<=m.w});
 const key=new Map(h.map(t=>[t,(helps(t)?100000:0)+keepScore(t,h)]));
 const order=[...h].sort((a,b)=>key.get(a)-key.get(b));
 for(const t of order){
  try{const c=JSON.parse(JSON.stringify(s));M.disc(c,u,t);Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,c);return}catch(e){}
 }

}
function botStep(s,u){
 const i=s.players.findIndex(p=>p.uid===u),tm=i%2,h=s.hands[u];
 if(!s.drawn){

  if(top!==undefined&&s.pozo.length<=6){const b=bestMeld([...h,top],s.melds.some(m=>m.team===tm&&m.t==='p'));if(b&&b.includes(top))return M.pozo(s,u)}

 }

 for(const t of h){if(N(t)===0)continue;
  for(const m of s.melds.filter(m=>m.team===tm)){
   const inf=meldInfo([...m.ids,t]);
   if(inf&&inf.w<=m.w&&ok(h.length-1,inf.ids.length>=7))return M.add(s,u,m.id,[t]);
  }}

// --- CREACIÓN DE SALA EN TV ---
async function makeRoom(){
 $('home').classList.add('hidden');
 const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rb=crypto.getRandomValues(new Uint8Array(6)),code=[...rb].map(x=>AL[x%AL.length]).join('');ref=doc(db,'burako',code);
 try{await setDoc(ref,{hostId:me,phase:'lobby',players:[],scores:[0,0],melds:[],msg:''})}
 catch(e){root.innerHTML='<p style="padding:20px;font-size:20px">⚠️ No se pudo crear la sala: '+e.message+'<br><small>Revisá las reglas de Firestore (tienen que permitir la colección "burako").</small></p>';return}
 onSnapshot(ref,sn=>sn.exists()&&render(sn.data()),e=>toast(e.message))
}

function goRoom(){const c=($('cd').value||'').trim().toUpperCase();if(c.length<6)return toast('Poné el código de 6 letras o números');location.href=location.pathname+'?r='+c}
// ---- reglas con imágenes y voz ----
const tid=(n,c)=>c*13+n-1,J=104;
const run=(a,b,c)=>Array.from({length:b-a+1},(_,k)=>tid(a+k,c));
const RP=[
{t:'Objetivo',x:'Burako se juega de a 2 o de a 4 jugadores. Con 4 se juega en parejas, y cada uno se sienta enfrente de su compañero. Gana el primer equipo que llega a 3000 puntos.',g:[]},
{t:'Las fichas y sus puntos',x:'Hay 104 fichas numeradas del 1 al 13 en cuatro colores, más 2 comodines. El 1 vale 15 puntos, el 2 vale 20, del 3 al 7 valen 5, y del 8 al 13 valen 10. El comodín vale 50.',g:[[[tid(1,0)],'15'],[[tid(2,1)],'20 (comodín)'],[[tid(5,2)],'5'],[[tid(11,3)],'10'],[[J],'50 (comodín)']]},
{t:'Reparto',x:'Cada jugador recibe 11 fichas. Se arman pilas de 11 fichas llamadas muertos. Una ficha se pone en el pozo y el resto queda en el mazo.',g:[]},
{t:'Tu turno',x:'En tu turno primero tenés que robar: o una ficha del mazo, o todo el pozo. Después podés bajar juegos o agregar fichas a los juegos de tu equipo. Para terminar, descartás una ficha al pozo.',g:[]}];
let rp=0,rv=true,RA=null;
function stopAudio(){if(RA){RA.onerror=null;try{RA.pause()}catch(e){}RA=null}if(window.speechSynthesis)speechSynthesis.cancel()}
function playRule(n,text){stopAudio();if(!rv)return;const ex=['mp3','m4a'];let k=0;
 const next=()=>{if(k>=ex.length){speak(text);return}
  const a=new Audio('audio/regla-'+n+'.'+ex[k++]);RA=a;
  a.onerror=()=>{if(RA===a)next()};
  const p=a.play();if(p&&p.catch)p.catch(()=>{if(RA===a)next()})};
 next()}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();if(!rv)return;const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.95;speechSynthesis.speak(u)}
function showRules(){rp=0;$('rules').style.display='block';rpage()}
function closeRules(){stopAudio();$('rules').style.display='none'}
function rgo(d){if(rp+d>=RP.length)return closeRules();rp=Math.max(0,rp+d);rpage()}
function rvoz(){rv=!rv;rpage()}
function rpage(){const p=RP[rp];
 $('rules').innerHTML=`<div style="max-width:1000px;margin:0 auto;text-align:center"><small>Página ${rp+1} de ${RP.length}</small><h1 style="margin:6px;font-size:3rem;color:#ffd54f">${p.t}</h1><p style="font-size:26px;line-height:1.4">${p.x}</p><div class="tv">${p.g.map(g=>`<div class="exg">${g[0].map(i=>T(i)).join('')}<div>${g[1]}</div></div>`).join('')}</div><div class="row" style="justify-content:center;margin-top:40px"><button class="s" onclick="rgo(-1)" ${rp?'':'disabled'}>◀ Anterior</button><button class="s" onclick="rvoz()">${rv?'🔊 Voz':'🔇 Voz'}</button><button id="rnext" onclick="rgo(1)" tabindex="100">${rp<RP.length-1?'Siguiente ▶':'Listo ✔'}</button><button class="s" onclick="closeRules()">✖ Cerrar</button></div></div>`;
 playRule(rp+1,p.x);$('rnext').focus()}
document.addEventListener('keydown',e=>{if($('rules').style.display!=='block')return;if(e.key==='ArrowRight')rgo(1);if(e.key==='ArrowLeft')rgo(-1);if(e.key==='Escape')closeRules()});

// ---- canal de YouTube y Spotify en la TV ----
let lastYT=null, lastSpo=null;
function ytSync(y){
 const k=y?JSON.stringify(y):'null';if(k===lastYT)return;lastYT=k;const b=$('ytbox');
 if(!y){b.style.display='none';b.innerHTML='';return}
 const q='autoplay=1&mute='+(y.mute!==false?1:0)+'&playsinline=1&rel=0&controls=0&modestbranding=1';
 const src=y.t==='c'?'https://www.youtube.com/embed/live_stream?channel='+y.id+'&'+q:'https://www.youtube.com/embed/'+y.id+'?'+q;
 b.innerHTML='<iframe src="'+src+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';b.style.display='block';
}

function spoSync(y){
 const k=y?JSON.stringify(y):'null';if(k===lastSpo)return;lastSpo=k;const b=$('spobox');
 if(!y){b.style.display='none';b.innerHTML='';return}
 b.innerHTML=`<iframe src="https://open.spotify.com/embed/${y.t}/${y.id}?utm_source=generator&theme=0" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
 b.style.display='block';
}

function fit(){
  const w=$('tvwrap');if(!w)return;let sc=1;
  for(let i=0;i<20;i++){
    w.style.width=(innerWidth/sc)+'px';w.style.transform=sc<1?'scale('+sc+')':'none';
    if((w.offsetHeight*sc<=innerHeight-4&&w.scrollWidth<=w.clientWidth+1)||sc<=.3)break;
    sc=Math.round((sc-.05)*100)/100
  }
}
addEventListener('resize',()=>{if(!new URLSearchParams(location.search).get('r'))fit()});
