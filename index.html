// --- DECLARACIÓN INICIAL DE AUDIO PARA EVITAR ERRORES DE CACHÉ FIREBASE ---
let gameMuted = false;
let AC=null,PV=null;

window.toggleGameMute = function() {
    gameMuted = !gameMuted;
    const btn = document.getElementById('muteGameBtn');
    if(gameMuted) {
        btn.innerText = '🔇 Sonido Fichas: OFF';

function audio(){
  if(gameMuted) return;
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}

function osc(t,f,f2,d,v,type){
  if(!AC || gameMuted) return;
  const o=AC.createOscillator(),g=AC.createGain(),T0=AC.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,T0);o.frequency.exponentialRampToValueAtTime(f2,T0+d*.8);
  g.gain.setValueAtTime(v,T0);g.gain.exponentialRampToValueAtTime(.001,T0+d);o.connect(g);g.connect(AC.destination);o.start(T0);o.stop(T0+d+.02)
}

const sndDrop=()=>{ if(gameMuted) return; osc(0,260,110,.14,.5,'triangle');osc(0,1500,700,.04,.12,'square')};
const sndMeld=()=>{ if(gameMuted) return; [300,360,430].forEach((f,k)=>{osc(k*.08,f,f*.5,.12,.4,'triangle');osc(k*.08,1500,800,.03,.08,'square')});osc(.26,660,660,.35,.18,'sine');osc(.36,880,880,.45,.18,'sine')};

document.addEventListener('click',audio);

// --- VARIABLES GLOBALES RESTANTES ---
const COL=['#d32f2f','#f9a825','#1976d2','#222'];
const N=i=>i>=104?0:(i%52)%13+1, C=i=>i>=104?4:Math.floor((i%52)/13);
const V=i=>{const n=N(i);return n===0?50:n===1?15:n===2?20:n<=7?5:10};
const T=(i,x='',st='')=>`<div class="t ${x}" data-i="${i}" style="color:${i>=104?'#7b1fa2':COL[C(i)]};${st}">${i>=104?'★':N(i)}</div>`;
const sortR=a=>[...a].sort((x,y)=>(C(x)-C(y))||(N(x)-N(y)));
let me,ref,S=null,sel=new Set();
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)};

// --- SISTEMA DE NAVEGACIÓN D-PAD ---
let currentFocusIndex = -1;
function handleDPadNavigation(e) {
  const focusables = Array.from(document.querySelectorAll('button:not([disabled]):not(.hidden), input:not(.hidden)'))
                          .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0);
  if(focusables.length === 0) return;

  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    currentFocusIndex = (currentFocusIndex + 1) % focusables.length;
    focusables[currentFocusIndex].focus();
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    currentFocusIndex = (currentFocusIndex - 1 + focusables.length) % focusables.length;
    focusables[currentFocusIndex].focus();
  }
}
document.addEventListener('keydown', handleDPadNavigation);


// ---- validación de juegos ----
function meldInfo(ids){
 if(ids.length<3||ids.length>14)return null;
 const gs=[...new Set(ids.filter(N).map(N))];
 for(const g of gs){
  const nat=ids.filter(i=>N(i)===g),oth=ids.filter(i=>N(i)!==g);
  if(oth.length>1||oth.some(i=>N(i)&&N(i)!==2))continue;
  if(nat.length<2)continue;
  return{t:'p',ids:[...nat,...oth],w:oth.length};
 }
 const cols=[...new Set(ids.filter(i=>N(i)&&N(i)!==2).map(C))];
 if(cols.length>1)return null;
 const tc=cols.length?cols:[...new Set(ids.filter(i=>N(i)===2).map(C))],L=ids.length;
 let best=null;
 for(const col of tc)for(let s=1;s+L-1<=14;s++){
  const pos=Array(L).fill(null),left=[];
  for(const i of ids){const n=N(i);let p=-1;if(n&&C(i)===col)p=n===1?(s===1?0:14-s):n-s;
   if(p>=0&&p<L&&pos[p]===null)pos[p]=i;else left.push(i)}
  if(left.some(i=>N(i)&&N(i)!==2)||left.length>1)continue;
  if(left.length)pos[pos.indexOf(null)]=left[0];
  if(!best||left.length<best.w)best={t:'e',ids:pos,w:left.length};
 }
 return best;
}

// ---- lógica ----
const act=(fn,opt=true)=>{if(opt&&S){try{const l=JSON.parse(JSON.stringify(S));fn(l);render(l)}catch(e){toast(e.message||'Error');return}}return runTransaction(db,async t=>{const sn=await t.get(ref);const s=sn.data();fn(s);t.set(ref,s)}).catch(e=>toast(e.message||'Error'))};
const idx=s=>s.players.findIndex(p=>p.uid===me);
const hasCan=(s,tm)=>s.melds.some(m=>m.team===tm&&m.ids.length>=7);
function turnChk(s,u){const i=s.players.findIndex(p=>p.uid===u);if(i<0||s.turn!==i)throw Error('No es tu turno');return i}
function nextT(s){s.turn=(s.turn+1)%s.players.length;s.drawn=false}
function after(s,i,disc,cutId){
 const u=s.players[i].uid,tm=i%2,h=s.hands[u];
 if(h.length===0){
  if(s.mtn[tm]<s.mtT){s.hands[u]=s.muertos[tm+'_'+s.mtn[tm]];s.mtn[tm]++;s.msg+=' ¡Levantó el muerto'+(s.mtT>1?' ('+s.mtn[tm]+' de '+s.mtT+')':'')+'!';if(disc)nextT(s);return}
  if(!hasCan(s,tm))throw Error('Para cerrar necesitás una canasta: guardate una ficha');
  s.cutId=cutId===undefined?null:cutId;
  return endHand(s,tm);
 }
 if(disc)nextT(s);
}
function endHand(s,closer){
 s.closer=closer;if(closer===null)s.cutId=null;
 const res=[0,1].map(tm=>{
  const mine=s.melds.filter(m=>m.team===tm);
  const mp=mine.reduce((a,m)=>a+m.ids.reduce((b,i)=>b+V(i),0),0),cb=mine.reduce((a,m)=>a+(m.ids.length>=7?(m.w?100:200):0),0);
  const noCan=closer!==null&&closer!==tm&&!hasCan(s,tm);
  let p=noCan?-mp:mp+cb;
  p+=s.mtn[tm]*100-(s.mtT-s.mtn[tm])*100;if(closer===tm)p+=100;
  s.players.forEach((pl,k)=>{if(k%2===tm)p-=(s.hands[pl.uid]||[]).reduce((a,i)=>a+V(i),0)});
  s.scores[tm]+=p;return{team:tm,pts:p,total:s.scores[tm],noCan};
 });
s.winner=res[0].pts===res[1].pts?-1:(res[0].pts>res[1].pts?0:1);
 s.result=res;s.phase=res.some(r=>r.total>=3000)?'over':'end';
}
function deal(s){
 const a=[...Array(106).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 s.hands={};s.players.forEach(p=>s.hands[p.uid]=a.splice(0,11));
 s.mtT=s.players.length===2?2:1;s.muertos={};[0,1].forEach(t=>{for(let k=0;k<s.mtT;k++)s.muertos[t+'_'+k]=a.splice(0,11)});s.mtn=[0,0];
 s.cutId=null;s.closer=null;s.winner=-1;s.pozo=a.splice(0,1);s.deck=a;s.melds=[];s.phase='play';s.drawn=false;s.result=null;
 s.turn=((s.hand=(s.hand||0)+1)-1)%s.players.length;s.msg='¡Nueva mano!';
}
// acciones de juego
const M={
 draw(s,u){const i=turnChk(s,u);if(s.drawn)throw Error('Ya robaste');
  if(!s.deck.length)return endHand(s,null);
  s.hands[u].push(s.deck.pop());s.drawn=true;s.msg=s.players[i].name+' robó del mazo'},
 pozo(s,u){const i=turnChk(s,u);if(s.drawn)throw Error('Ya robaste');if(!s.pozo.length)throw Error('El pozo está vacío');
  s.hands[u].push(...s.pozo);s.msg=s.players[i].name+' levantó el pozo ('+s.pozo.length+')';s.pozo=[];s.drawn=true},
 meld(s,u,ids){const i=turnChk(s,u);if(!s.drawn)throw Error('Primero robá');
  const inf=meldInfo(ids);if(!inf)throw Error('Esa combinación no es válida');
  s.hands[u]=s.hands[u].filter(x=>!ids.includes(x));s.melds.push({id:Date.now()+s.melds.length,team:i%2,...inf});
  s.msg=s.players[i].name+' bajó un juego';after(s,i,false)},
 add(s,u,mid,ids){const i=turnChk(s,u);if(!s.drawn)throw Error('Primero robá');
  const m=s.melds.find(x=>x.id===mid);if(!m||m.team!==i%2)throw Error('Juego inválido');
  const inf=meldInfo([...m.ids,...ids]);if(!inf)throw Error(m.w?'Ese juego ya tiene un comodín: la ficha solo entra si va en su número y color':'No encaja en ese juego');
  s.hands[u]=s.hands[u].filter(x=>!ids.includes(x));Object.assign(m,inf);
  s.msg=s.players[i].name+' agregó fichas';after(s,i,false)},
 disc(s,u,id){const i=turnChk(s,u);if(!s.drawn)throw Error('Primero robá');
  s.hands[u]=s.hands[u].filter(x=>x!==id);s.pozo.push(id);s.msg=s.players[i].name+' descartó';after(s,i,true,id)},
 cut(s,u,id){const i=turnChk(s,u);if(!s.drawn)throw Error('Primero robá');const tm=i%2,h=s.hands[u];
  if(h.length!==2||!h.includes(id))throw Error('Para cortar con una ficha tenés que tener 2 en el atril');

}
