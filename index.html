<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
// === PEGÁ ACÁ la config de tu proyecto Firebase (la misma de teg-tv) ===
const firebaseConfig={apiKey:"AIzaSyDnQsK7jNVciU2Ruo-mwELvFR97S6tNhgg",authDomain:"teg-tv.firebaseapp.com",projectId:"teg-tv",storageBucket:"teg-tv.firebasestorage.app",messagingSenderId:"735650643113",appId:"1:735650643113:web:e0ad00556934ce48773db8"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id),root=$('root');
const COL=['#d32f2f','#f9a825','#1976d2','#222'];
const N=i=>i>=104?0:(i%52)%13+1, C=i=>i>=104?4:Math.floor((i%52)/13);
const V=i=>{const n=N(i);return n===0?50:n===1?15:n===2?20:n<=7?5:10};
const T=(i,x='',st='')=>`<div class="t ${x}" data-i="${i}" style="color:${i>=104?'#7b1fa2':COL[C(i)]};${st}">${i>=104?'★':N(i)}</div>`;
const sortR=a=>[...a].sort((x,y)=>(C(x)-C(y))||(N(x)-N(y)));
let me,ref,S=null,sel=new Set();
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};

// ---- validación de juegos ----
function meldInfo(ids){
 if(ids.length<3||ids.length>14)return null;
 const gs=[...new Set(ids.filter(N).map(N))];
 for(const g of gs){
  const nat=ids.filter(i=>N(i)===g),oth=ids.filter(i=>N(i)!==g);
  if(oth.length>1||oth.some(i=>N(i)&&N(i)!==2))continue;
  if(nat.length<2)continue;
  return{t:'p',ids:[...nat,...oth],w:oth.length};
 }
 const cols=[...new Set(ids.filter(i=>N(i)&&N(i)!==2).map(C))];
 if(cols.length>1)return null;
 const tc=cols.length?cols:[...new Set(ids.filter(i=>N(i)===2).map(C))],L=ids.length;
 let best=null;
 for(const col of tc)for(let s=1;s+L-1<=14;s++){
  const pos=Array(L).fill(null),left=[];
  for(const i of ids){const n=N(i);let p=-1;if(n&&C(i)===col)p=n===1?(s===1?0:14-s):n-s;
   if(p>=0&&p<L&&pos[p]===null)pos[p]=i;else left.push(i)}
  if(left.some(i=>N(i)&&N(i)!==2)||left.length>1)continue;
  if(left.length)pos[pos.indexOf(null)]=left[0];
  if(!best||left.length<best.w)best={t:'e',ids:pos,w:left.length};
 }
 return best;
}

// ---- lógica (corre en el celular, dentro de una transacción) ----
const act=(fn,opt=true)=>{if(opt&&S){try{const l=JSON.parse(JSON.stringify(S));fn(l);render(l)}catch(e){toast(e.message||'Error');return}}return runTransaction(db,async t=>{const sn=await t.get(ref);const s=sn.data();fn(s);t.set(ref,s)}).catch(e=>toast(e.message||'Error'))};
const idx=s=>s.players.findIndex(p=>p.uid===me);
const hasCan=(s,tm)=>s.melds.some(m=>m.team===tm&&m.ids.length>=7);
function turnChk(s){const i=idx(s);if(i<0||s.turn!==i)throw Error('No es tu turno');return i}
function nextT(s){s.turn=(s.turn+1)%s.players.length;s.drawn=false}
function after(s,i,disc){
 const tm=i%2,h=s.hands[me];
 if(h.length===0){
  if(s.mtn[tm]<s.mtT){s.hands[me]=s.muertos[tm+'_'+s.mtn[tm]];s.mtn[tm]++;s.msg+=' ¡Levantó el muerto'+(s.mtT>1?' ('+s.mtn[tm]+' de '+s.mtT+')':'')+'!';if(disc)nextT(s);return}
  if(!hasCan(s,tm))throw Error('Para cerrar necesitás una canasta: guardate una ficha');
  return endHand(s,tm);
 }
 if(disc)nextT(s);
}
function endHand(s,closer){
 const res=[0,1].map(tm=>{
  let p=s.melds.filter(m=>m.team===tm).reduce((a,m)=>a+m.ids.reduce((b,i)=>b+V(i),0)+(m.ids.length>=7?(m.w?100:200):0),0);
  p+=s.mtn[tm]*100-(s.mtT-s.mtn[tm])*100;if(closer===tm)p+=100;
  s.players.forEach((pl,k)=>{if(k%2===tm)p-=(s.hands[pl.uid]||[]).reduce((a,i)=>a+V(i),0)});
  s.scores[tm]+=p;return{team:tm,pts:p,total:s.scores[tm]};
 });
 s.result=res;s.phase=res.some(r=>r.total>=3000)?'over':'end';
}
function deal(s){
 const a=[...Array(106).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 s.hands={};s.players.forEach(p=>s.hands[p.uid]=a.splice(0,11));
 s.mtT=s.players.length===2?2:1;s.muertos={};[0,1].forEach(t=>{for(let k=0;k<s.mtT;k++)s.muertos[t+'_'+k]=a.splice(0,11)});s.mtn=[0,0];
 s.pozo=a.splice(0,1);s.deck=a;s.melds=[];s.phase='play';s.drawn=false;s.result=null;
 s.turn=(s.hand=(s.hand||0)+1)%s.players.length-0;s.msg='¡Nueva mano!';
}
const A={
 join(name){act(s=>{if(s.phase!=='lobby')throw Error('Ya empezó');if(idx(s)<0){if(s.players.length>=4)throw Error('Sala llena');s.players.push({uid:me,name})}})},
 start(){act(s=>{const n=s.players.length;if(n!==2&&n!==4)throw Error('Se juega de a 2 o de a 4');s.scores=[0,0];s.hand=0;deal(s)},false)},
 again(){act(s=>{if(s.phase==='over')s.scores=[0,0];deal(s)},false)},
 draw(){act(s=>{const i=turnChk(s);if(s.drawn)throw Error('Ya robaste');
  if(!s.deck.length)return endHand(s,null);
  s.hands[me].push(s.deck.pop());s.drawn=true;s.msg=s.players[i].name+' robó del mazo'})},
 pozo(){act(s=>{const i=turnChk(s);if(s.drawn)throw Error('Ya robaste');if(!s.pozo.length)throw Error('El pozo está vacío');
  s.hands[me].push(...s.pozo);s.msg=s.players[i].name+' levantó el pozo ('+s.pozo.length+')';s.pozo=[];s.drawn=true})},
 meld(ids){act(s=>{const i=turnChk(s);if(!s.drawn)throw Error('Primero robá');
  const inf=meldInfo(ids);if(!inf)throw Error('Esa combinación no es válida');
  s.hands[me]=s.hands[me].filter(x=>!ids.includes(x));s.melds.push({id:Date.now(),team:i%2,...inf});
  s.msg=s.players[i].name+' bajó un juego';after(s,i,false)})},
 add(mid,ids){act(s=>{const i=turnChk(s);if(!s.drawn)throw Error('Primero robá');
  const m=s.melds.find(x=>x.id===mid);if(!m||m.team!==i%2)throw Error('Juego inválido');
  const inf=meldInfo([...m.ids,...ids]);if(!inf)throw Error(m.w?'Ese juego ya tiene un comodín: la ficha solo entra si va en su número y color':'No encaja en ese juego');
  s.hands[me]=s.hands[me].filter(x=>!ids.includes(x));Object.assign(m,inf);
  s.msg=s.players[i].name+' agregó fichas';after(s,i,false)})},
 disc(id){act(s=>{const i=turnChk(s);if(!s.drawn)throw Error('Primero robá');
  s.hands[me]=s.hands[me].filter(x=>x!==id);s.pozo.push(id);s.msg=s.players[i].name+' descartó';after(s,i,true)})}
};

// ---- vistas ----
const teamName=(s,t)=>s.players.filter((_,k)=>k%2===t).map(p=>p.name).join(' y ')||'—';
const meldTiles=m=>m.ids.map((x,k)=>T(x,m.ids.length>=7&&k===m.ids.length-1?'cx'+(m.w?'':' pure'):'')).join('');
const meldHtml=(m,cls='')=>`<div class="card ${cls}" style="margin:4px 0">${meldTiles(m)}</div>`;
const rnd=(id,k)=>{const x=Math.sin(id*12.9898+k*78.233)*43758.5453;return x-Math.floor(x)};
const pozoTV=a=>`<div class="pz">${a.map((id,k)=>T(id,'',`left:${(rnd(id,1)*78+2).toFixed(1)}%;top:${(rnd(id,2)*72+2).toFixed(1)}%;transform:rotate(${(rnd(id,3)*80-40).toFixed(0)}deg);z-index:${k}`)).join('')}</div>`;
const muertosTV=(s,t)=>'<span style="display:inline-flex;gap:5px">'+Array.from({length:s.mtT},(_,k)=>`<span class="mu ${k<s.mtn[t]?'tk':''}">MUERTO</span>`).join('')+'</span>';
const pilesTV=n=>{const p=Math.ceil(n/10);if(!p)return '<div class="msg">¡Mazo vacío! Hay que cortar</div>';let h='';
 for(let k=0;k<p;k++){const c=k===p-1?n-10*k:10;h+=`<div class="pile"><i style="top:8px;left:0"></i><i style="top:4px;left:3px"></i><i style="top:0;left:6px"></i><b>${c}</b></div>`}
 return `<div class="row" style="justify-content:center">${h}</div><small>Montones de 10 fichas</small>${p===1?`<div class="msg">Último montón: quedan ${n} fichas · ¡a cortar!</div>`:''}`};
function tv(s){
 if(s.phase==='lobby'){
  document.body.style.overflow='hidden';root.innerHTML=`<div id="tvwrap" class="tv" style="text-align:center;padding:30px"><h1>BURAKO</h1><p>Escaneá el QR con el celular (2 o 4 jugadores)</p><div id="qr" style="display:inline-block;background:#fff;padding:12px;border-radius:12px"></div><p class="big">${ref.id}</p><h2>${s.players.map(p=>p.name).join(' · ')||'Esperando jugadores…'}</h2><button class="s" style="font-size:22px" onclick="showRules()">📖 Reglas del juego</button></div>`;
  new QRCode($('qr'),{text:location.origin+location.pathname+'?r='+ref.id,width:240,height:240});fit();return;
 }
 const cur=s.players[s.turn];
 const col=t=>`<div><h2 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${teamName(s,t)} — ${s.scores[t]} ${muertosTV(s,t)}</h2>${s.melds.filter(m=>m.team===t).map(m=>meldHtml(m,'mt')).join('')}</div>`;
 let end='';
 if(s.phase!=='play')end=`<div class="card"><h2>${s.phase==='over'?'¡Fin del juego!':'Fin de la mano'}</h2>${s.result.map(r=>`<p>${teamName(s,r.team)}: ${r.pts>=0?'+':''}${r.pts} → <b>${r.total}</b></p>`).join('')}</div>`;
 document.body.style.overflow='hidden';root.innerHTML=`<div id="tvwrap" class="tv"><div class="tvg">${col(0)}<div style="text-align:center"><div class="msg">${s.phase==='play'?'Juega: '+cur.name:''}</div><h3>Pozo (${s.pozo.length})</h3>${pozoTV(s.pozo)}<h3>Mazo (${s.deck.length})</h3>${pilesTV(s.deck.length)}<p>${s.msg||''}</p>${end}</div>${col(1)}</div></div>`;fit();
}
let RK={a:[],b:[]},drag=null;
try{RK=JSON.parse(localStorage.rk)||RK}catch(e){}
function syncRack(h){RK.a=RK.a.filter(x=>h.includes(x));RK.b=RK.b.filter(x=>h.includes(x));
 h.forEach(x=>{if(!RK.a.includes(x)&&!RK.b.includes(x))RK.a.push(x)});localStorage.rk=JSON.stringify(RK)}
function sortRack(){RK.a=sortR(RK.a);RK.b=sortR(RK.b);localStorage.rk=JSON.stringify(RK);phone(S)}
function addTo(id){const i=idx(S);if(S.turn!==i||!S.drawn||!sel.size)return toast('Elegí fichas del atril y después tocá el juego');A.add(id,[...sel])}
function clearHi(){document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));document.querySelectorAll('.t').forEach(t=>t.style.removeProperty('--gx'))}
function bindRack(){
 const r=$('rack');
 r.onpointerdown=e=>{const el=e.target.closest('.t');if(!el)return;
  const cells=[...document.querySelectorAll('.rk,.meld')].map(c=>({c,r:c.getBoundingClientRect(),tl:[...c.querySelectorAll('.t')].filter(t=>t!==el).map(t=>({t,r:t.getBoundingClientRect()}))}));
  drag={el,id:+el.dataset.i,x:e.clientX,y:e.clientY,moved:false,cells,tg:null};el.setPointerCapture(e.pointerId)};
 r.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>8)drag.moved=true;
  if(!drag.moved)return;
  drag.el.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`;drag.el.style.zIndex=9;drag.el.style.transition='none';
  const X=e.clientX,Y=e.clientY,P=8;
  const cell=drag.cells.find(o=>X>=o.r.left-P&&X<=o.r.right+P&&Y>=o.r.top-P&&Y<=o.r.bottom+P);
  const tg=cell?{cell,k:(i=>i<0?cell.tl.length:i)(cell.tl.findIndex(o=>Y<o.r.bottom&&(Y<o.r.top||X<o.r.left+o.r.width/2)))}:null;
  const same=tg&&drag.tg&&tg.cell===drag.tg.cell&&tg.k===drag.tg.k;
  if(same||(!tg&&!drag.tg))return;
  clearHi();drag.tg=tg;if(!tg)return;
  tg.cell.c.classList.add('over');
  tg.cell.tl.forEach((o,i)=>{if(i>=tg.k)o.t.style.setProperty('--gx','34px')})};
 r.onpointerup=e=>{if(!drag)return;const d=drag;drag=null;clearHi();
  if(!d.moved){sel.has(d.id)?sel.delete(d.id):sel.add(d.id);return phone(S)}
  const tg=d.tg;
  if(tg&&tg.cell.c.classList.contains('meld')){A.add(+tg.cell.c.dataset.m,sel.has(d.id)?[...sel]:[d.id]);return phone(S)}
  if(tg){RK.a=RK.a.filter(x=>x!==d.id);RK.b=RK.b.filter(x=>x!==d.id);
   const L=RK[tg.cell.c.dataset.r],o=tg.cell.tl[tg.k];const k=o?L.indexOf(+o.t.dataset.i):-1;k>=0?L.splice(k,0,d.id):L.push(d.id);
   localStorage.rk=JSON.stringify(RK)}
  phone(S)};
 r.onpointercancel=()=>{drag=null;clearHi();phone(S)};
}
function phone(s){
 const i=idx(s);
 if(s.phase==='lobby'){
  if(i<0){root.innerHTML=`<div style="padding:20px"><h2>Burako — sala ${ref.id}</h2><input id="nm" placeholder="Tu nombre" value="${localStorage.nm||''}"><button onclick="localStorage.nm=nm.value;A.join(nm.value||'Jugador')">Entrar</button></div>`;return}
  root.innerHTML=`<div style="padding:20px"><h2>Sala ${ref.id}</h2><p>${s.players.map(p=>p.name).join(', ')}</p>${i===0?`<button onclick="A.start()">Comenzar (${s.players.length} jugadores)</button>`:'<p>Esperá que empiece el primero…</p>'}</div>`;return;
 }
 if(i<0){root.innerHTML='<p style="padding:20px">Partida en curso.</p>';return}
 const h=s.hands[me]||[],mine=s.turn===i,tm=i%2;syncRack(h);sel=new Set([...sel].filter(x=>h.includes(x)));
 let end='';
 if(s.phase!=='play')end=`<div class="card"><h3>${s.phase==='over'?'¡Fin del juego!':'Fin de la mano'}</h3>${s.result.map(r=>`<p>${teamName(s,r.team)}: ${r.pts>=0?'+':''}${r.pts} → <b>${r.total}</b></p>`).join('')}<button onclick="A.again()">${s.phase==='over'?'Nueva partida':'Siguiente mano'}</button></div>`;
 const can=mine&&s.drawn&&sel.size>0;
 const my=s.melds.filter(m=>m.team===tm).map(m=>`<div class="card sm meld ${can?'tap':''}" data-m="${m.id}" style="margin:4px 0" onclick="addTo(${m.id})">${meldTiles(m)}</div>`).join('');
 root.innerHTML=`<div style="padding:12px;padding-bottom:40px">
 <div class="msg">${s.phase==='play'?(mine?(s.drawn?'Tu turno: bajá o descartá':'Tu turno: robá'):'Juega '+s.players[s.turn].name):'—'}</div>
 <small>${teamName(s,0)}: ${s.scores[0]} · ${teamName(s,1)}: ${s.scores[1]} · Mazo ${s.deck.length} · Pozo ${s.pozo.length} · Muertos ${s.mtn[tm]}/${s.mtT}</small>${end}
 ${s.pozo.length?`<small>Pozo (${s.pozo.length}) — si levantás, te llevás todas</small><div class="card sm pzp">${s.pozo.map(x=>T(x)).join('')}</div>`:''}
 <h3>Juegos de mi equipo</h3>${my||'<small>Todavía no bajaron nada</small>'}${can&&my?'<small>Tocá un juego para sumar las fichas elegidas</small>':''}
 ${s.phase==='play'&&mine?`<div class="row" style="margin-top:8px"><button ${s.drawn?'disabled':''} onclick="A.draw()">Robar</button><button ${s.drawn?'disabled':''} onclick="A.pozo()">Levantar pozo</button></div><div class="row" style="margin-top:8px"><button ${!s.drawn||!sel.size?'disabled':''} onclick="bajar()">Bajar (${sel.size})</button><button class="s" ${!s.drawn||sel.size!==1?'disabled':''} onclick="descartar()">Descartar</button></div>`:''}
 <div class="row" style="margin-top:10px;justify-content:space-between"><h3>Mi atril</h3><button class="s" onclick="sortRack()">Ordenar</button></div>
 <small>Tocá para elegir · arrastrá para mover (hay 2 filas)</small>
 <div id="rack"><div class="rk" data-r="a">${RK.a.map(x=>T(x,sel.has(x)?'sel':'')).join('')}</div><div class="rk" data-r="b">${RK.b.map(x=>T(x,sel.has(x)?'sel':'')).join('')}</div></div></div>`;
 bindRack();
}
function render(s){S=s;$('home').classList.add('hidden');if(drag&&drag.moved)return;
 if(!new URLSearchParams(location.search).get('r')){
  if(PV&&s.phase==='play'){const n=x=>x.melds.reduce((a,m)=>a+m.ids.length,0);
   const ml=s.melds.length>PV.melds.length||n(s)>n(PV),dr=s.pozo.length>PV.pozo.length;
   if(ml)sndMeld();if(dr)setTimeout(sndDrop,ml?500:0)}
  PV=s}
new URLSearchParams(location.search).get('r')?phone(s):tv(s)}

function home(){$('home').classList.remove('hidden')}
function bajar(){A.meld([...sel])}
function descartar(){A.disc([...sel][0])}
async function makeRoom(){
 $('home').classList.add('hidden');
 const code=Math.random().toString(36).slice(2,6).toUpperCase();ref=doc(db,'burako',code);
 try{await setDoc(ref,{phase:'lobby',players:[],scores:[0,0],melds:[],msg:''})}
 catch(e){root.innerHTML='<p style="padding:20px;font-size:20px">⚠️ No se pudo crear la sala: '+e.message+'<br><small>Revisá las reglas de Firestore (tienen que permitir la colección "burako").</small></p>';return}
 onSnapshot(ref,sn=>sn.exists()&&render(sn.data()),e=>toast(e.message))}
function goRoom(){const c=($('cd').value||'').trim().toUpperCase();if(c.length<4)return toast('Poné el código de 4 letras');location.href=location.pathname+'?r='+c}
// ---- reglas con imágenes y voz ----
const tid=(n,c)=>c*13+n-1,J=104;
const run=(a,b,c)=>Array.from({length:b-a+1},(_,k)=>tid(a+k,c));
const RP=[
{t:'Objetivo',x:'Burako se juega de a 2 o de a 4 jugadores. Con 4 se juega en parejas, y cada uno se sienta enfrente de su compañero. Gana el primer equipo que llega a 3000 puntos.',g:[]},
{t:'Las fichas y sus puntos',x:'Hay 104 fichas numeradas del 1 al 13 en cuatro colores, más 2 comodines. El 1 vale 15 puntos, el 2 vale 20, del 3 al 7 valen 5, y del 8 al 13 valen 10. El comodín vale 50. El comodín y el 2 pueden reemplazar a cualquier ficha. El 2 siempre cuenta 20 puntos, aunque esté usado como comodín.',g:[[[tid(1,0)],'15'],[[tid(2,1)],'20 (comodín)'],[[tid(5,2)],'5'],[[tid(11,3)],'10'],[[J],'50 (comodín)']]},
{t:'Reparto',x:'Cada jugador recibe 11 fichas en su atril, que es su celular. Se arman pilas de 11 fichas llamadas muertos: con 4 jugadores hay una por pareja, y con 2 jugadores cada uno tiene dos muertos. Una ficha se pone en el pozo y el resto queda en el mazo.',g:[]},
{t:'Tu turno',x:'En tu turno primero tenés que robar: o una ficha del mazo, o todo el pozo. Después podés bajar juegos o agregar fichas a los juegos de tu equipo. Para terminar, descartás una ficha al pozo.',g:[]},
{t:'Piernas',x:'Una pierna son 3 o más fichas del mismo número. Pueden ser de distinto color, y también se pueden repetir colores. Se permite un solo comodín por juego.',g:[[[tid(7,0),tid(7,1),tid(7,2)],'Pierna'],[[tid(3,0),tid(3,0)+52,tid(3,1),tid(3,2)],'También vale repetir color'],[[tid(9,3),tid(9,0),J],'Con un comodín']]},
{t:'Escaleras',x:'Una escalera son 3 o más fichas del mismo color, en orden. El 1 puede ir antes del 2 o después del 13. Si falta una ficha en el medio, un comodín ocupa su lugar. Un juego solo puede tener un comodín. Un 2 del mismo color puesto en su lugar vale como ficha común y no como comodín.',g:[[run(4,7,1),'Escalera'],[[tid(4,2),tid(5,2),J,tid(7,2)],'El comodín tapa el 6'],[[tid(12,0),tid(13,0),tid(1,0)],'El 1 va después del 13'],[run(1,3,3),'o antes del 2']]},
{t:'Canastas',x:'Una canasta es un juego de 7 o más fichas. Si no tiene ningún comodín es una canasta limpia y suma 200 puntos. Si usa un comodín es una canasta sucia y suma 100 puntos.',g:[[run(3,9,0),'Limpia: 200 puntos'],[[...run(3,5,2),J,...run(7,9,2)],'Sucia: 100 puntos']]},
{t:'El muerto y cerrar',x:'Cuando te quedás sin fichas, levantás un muerto y seguís jugando. Con 2 jugadores tenés dos muertos: tenés que quedarte sin fichas dos veces antes de poder cortar. Cada muerto levantado suma 100 puntos y cada uno que no levantás resta 100. Para cerrar la mano tenés que haber levantado todos tus muertos y tener al menos una canasta. Cerrar suma 100 puntos.',g:[]},
{t:'Puntos de cada mano',x:'Al terminar la mano se suman las fichas que bajaste a la mesa, las canastas, el muerto y el cierre. Se restan las fichas que te quedaron en el atril. Se juega hasta que un equipo llega a 3000 puntos.',g:[]},
{t:'Cómo se juega desde el celular',x:'Tocá una ficha para elegirla y apretá el botón Bajar para formar un juego. Para agregar a un juego que ya está en la mesa, arrastrá la ficha hasta ese juego y soltala. Podés mover las fichas del atril, que tiene dos filas, arrastrándolas. Cuando tengas tu turno, el celular te avisa.',g:[]}];
let rp=0,rv=true;
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();if(!rv)return;const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.95;speechSynthesis.speak(u)}
function showRules(){rp=0;$('rules').style.display='block';rpage()}
function closeRules(){if(window.speechSynthesis)speechSynthesis.cancel();$('rules').style.display='none'}
function rgo(d){if(rp+d>=RP.length)return closeRules();rp=Math.max(0,rp+d);rpage()}
function rvoz(){rv=!rv;rpage()}
function rpage(){const p=RP[rp];
 $('rules').innerHTML=`<div style="max-width:1000px;margin:0 auto;text-align:center"><small>Página ${rp+1} de ${RP.length}</small><h1 style="margin:6px">${p.t}</h1><p style="font-size:26px;line-height:1.4">${p.x}</p><div class="tv">${p.g.map(g=>`<div class="exg">${g[0].map(i=>T(i)).join('')}<div>${g[1]}</div></div>`).join('')}</div><div class="row" style="justify-content:center;margin-top:22px"><button class="s" onclick="rgo(-1)" ${rp?'':'disabled'}>◀ Anterior</button><button class="s" onclick="rvoz()">${rv?'🔊 Voz':'🔇 Voz'}</button><button id="rnext" onclick="rgo(1)">${rp<RP.length-1?'Siguiente ▶':'Listo ✔'}</button><button class="s" onclick="closeRules()">✖ Cerrar</button></div></div>`;
 speak(p.x);$('rnext').focus()}
document.addEventListener('keydown',e=>{if($('rules').style.display!=='block')return;if(e.key==='ArrowRight')rgo(1);if(e.key==='ArrowLeft')rgo(-1);if(e.key==='Escape')closeRules()});
$('hostBtn').onclick=()=>{audio();makeRoom()};
$('showJoinBtn').onclick=()=>$('joinBox').classList.toggle('hidden');
$('joinBtn').onclick=()=>goRoom();
$('rulesBtn').onclick=()=>showRules();
Object.assign(window,{A,makeRoom,goRoom,showRules,closeRules,rgo,rvoz,sortRack,addTo,bajar,descartar});
// ---- ajuste automático a la pantalla (TV) ----
function fit(){const w=$('tvwrap');if(!w)return;let sc=1;
 for(let i=0;i<20;i++){w.style.width=(innerWidth/sc)+'px';w.style.transform=sc<1?'scale('+sc+')':'none';
  if((w.offsetHeight*sc<=innerHeight-4&&w.scrollWidth<=w.clientWidth+1)||sc<=.3)break;sc=Math.round((sc-.05)*100)/100}}
addEventListener('resize',()=>{if(!new URLSearchParams(location.search).get('r'))fit()});
// ---- sonidos (se generan, no hay archivos) ----
let AC=null,PV=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function osc(t,f,f2,d,v,type){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),T0=AC.currentTime+t;
 o.type=type;o.frequency.setValueAtTime(f,T0);o.frequency.exponentialRampToValueAtTime(f2,T0+d*.8);
 g.gain.setValueAtTime(v,T0);g.gain.exponentialRampToValueAtTime(.001,T0+d);o.connect(g);g.connect(AC.destination);o.start(T0);o.stop(T0+d+.02)}
const sndDrop=()=>{osc(0,260,110,.14,.5,'triangle');osc(0,1500,700,.04,.12,'square')};
const sndMeld=()=>{[300,360,430].forEach((f,k)=>{osc(k*.08,f,f*.5,.12,.4,'triangle');osc(k*.08,1500,800,.03,.08,'square')});osc(.26,660,660,.35,.18,'sine');osc(.36,880,880,.45,.18,'sine')};
document.addEventListener('click',audio);document.addEventListener('keydown',audio);

signInAnonymously(auth).then(async u=>{
 me=u.user.uid;const r=new URLSearchParams(location.search).get('r');
 if(r){ref=doc(db,'burako',r.toUpperCase());onSnapshot(ref,sn=>sn.exists()?render(sn.data()):root.innerHTML='<p style="padding:20px">No existe esa sala. <a href="'+location.pathname+'" style="color:#ffd54f">Volver</a></p>',e=>toast(e.message))}
 else home();
}).catch(e=>{$('home').classList.add('hidden');root.innerHTML='<p style="padding:20px;font-size:20px">⚠️ '+e.message+'<br><small>Tiene que abrirse desde GitHub Pages/Firebase Hosting (https), no como archivo local.</small></p>'});
